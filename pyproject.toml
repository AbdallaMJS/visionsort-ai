[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionsort-ai"
version = "0.1.0"
description = "Explainable computer vision for recyclable-material classification"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.4",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
train = [
  "huggingface-hub>=0.25",
  "matplotlib>=3.8",
  "pandas>=2.2",
  "streamlit>=1.38",
  "torch>=2.3",
  "torchvision>=0.18",
]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
